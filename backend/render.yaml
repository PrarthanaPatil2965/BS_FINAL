services:
  - type: web
    name: blindspot-api
    runtime: python
    plan: free
    region: singapore
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: GROQ_API_KEY
        sync: false
      - key: USE_YOLO
        value: "off"
      - key: PYTHON_VERSION
        value: "3.11.9"
